name: AI Relay

on:
  push:
    branches: [relay-data]
    paths: [relay_result.json]

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relay-data

      - name: Get latest analysis script from main
        run: |
          git fetch origin main
          git checkout origin/main -- _relay_analyze.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install google-genai

      - name: Analyze and respond
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python _relay_analyze.py
